<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  </head>
  <body>
    <div class="app" x-data="chatApp()" x-init="init()">
      <!-- Sidebar overlay (mobile) -->
      <div
        class="sidebar-overlay"
        :class="{ visible: sidebarOpen }"
        @click="sidebarOpen = false"
      ></div>

      <!-- Sidebar -->
      <aside class="sidebar" :class="{ open: sidebarOpen }">
        <div class="sidebar-header">
          <div class="logo">
            <div class="logo-icon">✦</div>
            <span>Gemini Chat</span>
          </div>
          <button class="btn-new" @click="newChat()">
            <span>＋</span> New conversation
          </button>
        </div>

        <div class="conversation-list">
          <template x-if="conversations.length === 0">
            <p style="padding: 16px; color: var(--text-muted); font-size: 0.8125rem; text-align: center">
              No conversations yet
            </p>
          </template>

          <template x-for="conv in conversations" :key="conv.id">
            <div
              class="conversation-item"
              :class="{ active: currentConversationId === conv.id }"
              @click="selectConversation(conv.id)"
            >
              <div class="conv-text">
                <div class="conv-title" x-text="conv.title"></div>
                <div class="conv-date" x-text="formatDate(conv.updated_at)"></div>
              </div>
              <button
                class="btn-delete"
                @click.stop="deleteConversation(conv.id)"
                title="Delete"
              >
                ✕
              </button>
            </div>
          </template>
        </div>

        <div class="sidebar-footer">Powered by Google Gemini · SQLite</div>
      </aside>

      <!-- Main -->
      <main class="main">
        <header class="topbar">
          <button class="btn-toggle" @click="sidebarOpen = !sidebarOpen">☰</button>
          <span class="topbar-title" x-text="currentTitle"></span>
          <button
            class="btn-settings"
            @click="showSettings = true"
            :class="{ configured: hasApiKey }"
            title="API Key Settings"
          >
            ⚙
          </button>
          <span class="topbar-badge" x-text="selectedModel"></span>
        </header>

        <div class="messages-area" x-ref="messagesArea">
          <!-- Empty state -->
          <template x-if="messages.length === 0 && !loading">
            <div class="empty-state">
              <div class="empty-icon">✦</div>
              <h2>What's on your mind?</h2>
              <p>
                Ask anything — your conversations are saved locally in SQLite so you can pick up
                right where you left off.
              </p>
              <div class="suggestions">
                <template x-for="s in suggestions" :key="s">
                  <button class="suggestion-chip" @click="useSuggestion(s)" x-text="s"></button>
                </template>
              </div>
            </div>
          </template>

          <!-- Messages -->
          <template x-for="msg in messages" :key="msg.id">
            <div class="message" :class="msg.role">
              <div class="msg-avatar" x-text="msg.role === 'user' ? 'You' : '✦'"></div>
              <div class="msg-body">
                <div class="msg-bubble" x-text="msg.content"></div>
                <div class="msg-time" x-text="formatTime(msg.created_at)"></div>
              </div>
            </div>
          </template>

          <!-- Typing indicator -->
          <template x-if="loading">
            <div class="typing-indicator">
              <div class="msg-avatar">✦</div>
              <div class="typing-dots">
                <span></span><span></span><span></span>
              </div>
            </div>
          </template>
        </div>

        <!-- Input -->
        <div class="input-area">
          <div class="input-wrapper">
            <textarea
              x-ref="input"
              x-model="input"
              placeholder="Message Gemini..."
              rows="1"
              @keydown.enter.prevent="if (!$event.shiftKey) sendMessage()"
              @input="autoResize($event.target)"
              :disabled="loading"
            ></textarea>
            <button
              class="btn-send"
              @click="sendMessage()"
              :disabled="loading || !input.trim()"
              title="Send"
            >
              ↑
            </button>
          </div>
          <p class="input-hint">Enter to send · Shift+Enter for new line</p>
        </div>
      </main>

      <!-- Error toast -->
      <template x-if="error">
        <div class="toast" x-text="error" @click="error = ''"></div>
      </template>

      <!-- Settings modal -->
      <div class="modal-overlay" x-show="showSettings" x-cloak @click.self="showSettings = false">
        <div class="modal">
          <div class="modal-header">
            <h3>🔑 Gemini API Key</h3>
            <button class="modal-close" @click="showSettings = false">✕</button>
          </div>
          <p class="modal-desc">
            המפתח נשמר רק בדפדפן שלך (sessionStorage) — לא בקבצי הפרויקט ולא ב-Cursor.
          </p>
          <label class="field-label">API Key</label>
          <input
            type="password"
            class="field-input"
            x-model="apiKeyInput"
            placeholder="AIza..."
            @keydown.enter="saveApiKey()"
          />
          <p class="field-hint">
            <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">קבלי מפתח ב-Google AI Studio →</a>
          </p>
          <template x-if="hasApiKey">
            <p class="key-status">✓ מפתח מוגדר (<span x-text="maskedApiKey"></span>)</p>
          </template>
          <label class="field-label">Model</label>
          <select class="field-input" x-model="selectedModel">
            <template x-for="m in availableModels" :key="m.id">
              <option :value="m.id" x-text="m.label"></option>
            </template>
          </select>
          <p class="field-hint">Flash Lite מומלץ ל-Free Tier — פחות שגיאות מכסה</p>
          <div class="modal-actions">
            <button class="btn-secondary" @click="clearApiKey()" x-show="hasApiKey">מחק מפתח</button>
            <button class="btn-primary" @click="saveApiKey()">שמור</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const API_KEY_STORAGE = 'gemini_api_key';
      const MODEL_STORAGE = 'gemini_model';

      function chatApp() {
        return {
          conversations: [],
          messages: [],
          currentConversationId: null,
          input: '',
          loading: false,
          error: '',
          sidebarOpen: false,
          showSettings: false,
          apiKeyInput: '',
          selectedModel: sessionStorage.getItem(MODEL_STORAGE) || 'gemini-2.5-flash-lite',
          availableModels: [
            { id: 'gemini-2.5-flash-lite', label: '2.5 Flash Lite (מומלץ)' },
            { id: 'gemini-2.5-flash', label: '2.5 Flash' },
            { id: 'gemini-2.0-flash-lite', label: '2.0 Flash Lite' },
            { id: 'gemini-1.5-flash', label: '1.5 Flash' },
          ],
          suggestions: [
            'Explain quantum computing simply',
            'Write a Python fibonacci function',
            'Plan a weekend trip to Tokyo',
            'What are good habits for learning?',
          ],

          get currentTitle() {
            if (!this.currentConversationId) return 'New conversation';
            const conv = this.conversations.find((c) => c.id === this.currentConversationId);
            return conv ? conv.title : 'New conversation';
          },

          get hasApiKey() {
            return !!sessionStorage.getItem(API_KEY_STORAGE);
          },

          get maskedApiKey() {
            const key = sessionStorage.getItem(API_KEY_STORAGE) || '';
            if (key.length <= 8) return '••••••••';
            return key.slice(0, 4) + '••••' + key.slice(-4);
          },

          apiHeaders(json = true) {
            const headers = {
              'X-Gemini-Api-Key': sessionStorage.getItem(API_KEY_STORAGE) || '',
              'X-Gemini-Model': this.selectedModel,
            };
            if (json) headers['Content-Type'] = 'application/json';
            return headers;
          },

          saveApiKey() {
            const key = this.apiKeyInput.trim();
            if (!key) {
              this.error = 'יש להזין מפתח API';
              return;
            }
            sessionStorage.setItem(API_KEY_STORAGE, key);
            sessionStorage.setItem(MODEL_STORAGE, this.selectedModel);
            this.apiKeyInput = '';
            this.showSettings = false;
            this.error = '';
          },

          clearApiKey() {
            sessionStorage.removeItem(API_KEY_STORAGE);
            this.apiKeyInput = '';
          },

          ensureApiKey() {
            if (!this.hasApiKey) {
              this.showSettings = true;
              this.error = 'יש להזין מפתח API לפני שליחת הודעה';
              return false;
            }
            return true;
          },

          async init() {
            if (!this.hasApiKey) this.showSettings = true;
            this.$watch('selectedModel', (value) => sessionStorage.setItem(MODEL_STORAGE, value));
            await this.loadConversations();
          },

          async loadConversations() {
            try {
              const res = await fetch('/api/conversations');
              this.conversations = await res.json();
            } catch {
              this.error = 'Could not load conversations';
            }
          },

          async selectConversation(id) {
            this.currentConversationId = id;
            this.sidebarOpen = false;
            try {
              const res = await fetch(`/api/conversations/${id}/messages`);
              this.messages = await res.json();
              this.$nextTick(() => this.scrollToBottom());
            } catch {
              this.error = 'Could not load messages';
            }
          },

          async newChat() {
            this.currentConversationId = null;
            this.messages = [];
            this.input = '';
            this.sidebarOpen = false;
            this.$nextTick(() => this.$refs.input?.focus());
          },

          async deleteConversation(id) {
            try {
              await fetch(`/api/conversations/${id}`, { method: 'DELETE' });
              this.conversations = this.conversations.filter((c) => c.id !== id);
              if (this.currentConversationId === id) {
                await this.newChat();
              }
            } catch {
              this.error = 'Could not delete conversation';
            }
          },

          useSuggestion(text) {
            this.input = text;
            this.$nextTick(() => {
              this.autoResize(this.$refs.input);
              this.$refs.input?.focus();
            });
          },

          async sendMessage() {
            const text = this.input.trim();
            if (!text || this.loading) return;
            if (!this.ensureApiKey()) return;

            this.loading = true;
            this.error = '';
            this.input = '';

            const optimistic = {
              id: Date.now(),
              role: 'user',
              content: text,
              created_at: new Date().toISOString(),
            };
            this.messages.push(optimistic);
            this.$nextTick(() => this.scrollToBottom());

            try {
              const res = await fetch('/api/chat', {
                method: 'POST',
                headers: this.apiHeaders(),
                body: JSON.stringify({
                  message: text,
                  conversationId: this.currentConversationId,
                }),
              });

              const data = await res.json();

              if (data.conversationId) {
                this.currentConversationId = data.conversationId;
              }
              if (data.messages?.length) {
                this.messages = data.messages;
              }

              if (!res.ok) {
                throw new Error(data.error || 'Something went wrong');
              }

              await this.loadConversations();
              this.$nextTick(() => this.scrollToBottom());
            } catch (err) {
              this.error = err.message;
            } finally {
              this.loading = false;
              this.$nextTick(() => this.$refs.input?.focus());
            }
          },

          scrollToBottom() {
            const el = this.$refs.messagesArea;
            if (el) el.scrollTop = el.scrollHeight;
          },

          autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 140) + 'px';
          },

          formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso + (iso.includes('Z') ? '' : 'Z'));
            const now = new Date();
            const diff = now - d;
            if (diff < 86400000) return 'Today';
            if (diff < 172800000) return 'Yesterday';
            return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
          },

          formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso + (iso.includes('Z') ? '' : 'Z'));
            return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
          },
        };
      }
    </script>
  </body>
</html>
